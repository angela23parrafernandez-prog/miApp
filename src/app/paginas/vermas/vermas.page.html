<ion-header>
  <ion-toolbar>
    <ion-title>{{ producto.titulo }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="contenedor-vermas" [fullscreen]="true">
<img  [src]="producto.imagen"  class="imagen"   >
<div>
  <h2>{{producto.nombre}}</h2>
  <p>{{producto.descripcion}}</p>
  <h3>Precio: {{producto.precio}}</h3>
</div>


</ion-content>
